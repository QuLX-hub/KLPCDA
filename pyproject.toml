[project]
name = "klpcda"
version = "0.1.0"
description = "Kernelized Linear Principal Component Discriminant Analysis -- a scikit-learn-style estimator for small-sample, high-dimensional discriminant analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lingxiao Qu", email = "lingxiaoqu1126@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
